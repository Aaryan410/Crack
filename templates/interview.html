<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width", initial = 1.0>
        <title>Crack - Interview</title>

        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/interview.css') }}">
        <link rel = "preconnect" href = "https://fonts.googleapis.com">
        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel = "stylesheet">

        <script src = "{{ url_for('static', filename = 'js/timer.js') }}"></script>
    </head>
    <body>
        
        <div class = "page">

            <div class = "orb orb-gold-1"></div>
            <div class = "orb orb-gold-2"></div>
            <div class = "orb orb-violet"></div>

            <main class = "question-card">

                <div class = "top-row">
                    <div class = "question-tag">Question {{ question_number }}</div>
                    <div class = "timer">
                        <span class = "timer-dot"></span>
                        <span id = "timer-text">02:14</span>
                    </div>
                </div>

                <div class = "question-text">{{ question.question }}</div>

                <form id = "answer-form" method = "POST" action = "/answer">
                    
                    <textarea name = "answer" class = "answer-box" placeholder = "Type your answer here..."></textarea>

                    <div class = "bottom-row">
                        <button class = "submit-button">
                            <span class = "submit-black">Submit</span>
                        </button>
                    </div>

                </form>

            </main>
            
        </div>

    </body>
</html>
