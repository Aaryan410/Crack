<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title>Crack - Evaluating</title>

        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/evaluating.css') }}">
        <link rel = "preconnect" href = "https://fonts.googleapis.com">
        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel = "stylesheet">
    </head>
    <body>
        <div class = "page">
            <div class = "logo">Crack</div>
            <div class = "spinner" id = "spinner"></div>
            <p class = "loading-text" id = "status-text">Generating your interview report...</p>
            <button type = "button" id = "retry-button" hidden>
                Try again
            </button>
        </div>

        <script>
            const spinner = document.getElementById('spinner')
            let angle = 0;

            function rotate() {
                angle = (angle + 4) % 360;
                spinner.style.transform = `rotate(${angle}deg)`;
                requestAnimationFrame(rotate);
            }
            rotate();

            const statusText = document.getElementById("status-text");
            const retryButton = document.getElementById("retry-button");

            retryButton.addEventListener("click", () => {
                window.location.reload();
            });

            window.onload = async () => {
                try {
                    const response = await fetch("/generate-report", {
                        method: "POST"
                    });

                        window.location.replace("/");
                        return;
                    }

                    const data = await response.json();

                    if (!response.ok) {
                        spinner.style.display = "none";
                        statusText.textContent = 
                            data.error || "We couldn't generate your report.";

                        retryButton.hidden = response.status !== 503;
                        return;
                    }

                    window.location.replace(data.redirect_url);
                } catch (error) {
                    spinner.style.display = "none";
                    statusText.textContent =
                        "We couldn't connect. Please try again.";
                    retryButton.hidden = false;
                }
            };
        </script>

    </body>
</html>
