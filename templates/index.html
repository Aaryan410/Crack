<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content = "width = device-width", initial-scale = 1.0">
        <title>Crack</title>

        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/index.css') }}">

        <link rel = "preconnect" href = "https://fonts.googleapis.com">
        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel = "stylesheet">
    </head>
    <body>
        
        <div class = "page">

            <div class = "orb orb-gold-1"></div>
            <div class = "orb orb-gold-2"></div>
            <div class = "orb orb-violet"></div>

            <header class = "hero">
                <div class = "eyebrow-wrap">
                    <div class = "eyebrow-rule"></div>
                    <div class = "eyebrow-label">AI INTERVIEW COACH</div>
                    <div class = "eyebrow-rule"></div>
                </div>

                <h1 class = "headline">
                    <span class = "black">Crack the </span><span class = "violet">interview</span>
                </h1>

                <p class = "subtitle">Adaptive, role-specific interview coach with real-time evaluation</p>
            </header>

            <main class = "main">

                <form action = "/start" method = "POST">

                    <h2 class = "section-label">Choose your role</h2>

                    <div class = "role-grid">

                        <!-- ai engineer -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "ai_engineer">
                            <div class = "icon"><div class = "icon-label">AI</div></div>
                            <div class = "title">AI engineer</div>
                            <div class = "desc">APIs, database, system design</div>
                        </label>

                        <!-- backend dev -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "backend_developer">
                            <div class = "icon"><div class = "icon-label">BD</div></div>
                            <div class = "title">Backend Developer</div>
                            <div class = "desc">APIs, database, system design</div>
                        </label>

                        <!-- devops engineer -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "devops_engineer">
                            <div class = "icon"><div class = "icon-label">DO</div></div>
                            <div class = "title">DevOps engineer</div>
                            <div class = "desc">CI/CD, automation, observability</div>
                        </label>

                        <!-- cybersecurity analyst -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "cybersecurity_analyst">
                            <div class = "icon"><div class = "icon-label">CS</div></div>
                            <div class = "title">Cybersecurity analyst</div>
                            <div class = "desc">Threats, security ops, incident response</div>
                        </label>

                        <!-- data scientist -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "data_scientist">
                            <div class = "icon"><div class = "icon-label">DS</div></div>
                            <div class = "title">Data scientist</div>
                            <div class = "desc">Statistics, modeling, experimentation</div>
                        </label>

                        <!-- cloud engineer -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "cloud_engineer">
                            <div class = "icon"><div class = "icon-label">CE</div></div>
                            <div class = "title">Cloud engineer</div>
                            <div class = "desc">Infrastructure, scaling, cloud platforms </div>
                        </label>

                        <!-- frontend dev -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "frontend_developer">
                            <div class = "icon"><div class = "icon-label">FE</div></div>
                            <div class = "title">Frontend developer</div>
                            <div class = "desc">UI systems, performance, accessibility</div>
                        </label>

                        <!-- full stack dev -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "full_stack_developer">
                            <div class = "icon"><div class = "icon-label">FS</div></div>
                            <div class = "title">Full stack developer</div>
                            <div class = "desc">End-to-end product engineering</div>
                        </label>

                        <!-- ml engineer -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "machine_learning_engineer">
                            <div class = "icon"><div class = "icon-label">ML</div></div>
                            <div class = "title">ML engineer</div>
                            <div class = "desc">Model training, pipelines, MLOps</div>
                        </label>

                        <!-- software engineer -->
                        <label class = "role-card">
                            <input type = "radio" name = "role" value = "software_engineer">
                            <div class = "icon"><div class = "icon-label">SE</div></div>
                            <div class = "title">Software engineer</div>
                            <div class = "desc">Core CS, algorithms, architecture</div>
                        </label>
                    </div>

                    
                    <button type = "submit" class = "cta">
                        <span class = "cta-black">Start </span><span class = "cta-violet">interview</span>
                    </button>

                </form>

            </main>

        </div>

    </body>
</html>
