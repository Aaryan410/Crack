<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">

        <title>{% block title %}Crack{% endblock %}</title>

        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/base.css') }}">

        {% block styles %}{% endblock %}
    </head>
    <body>
        <header>
            <a href = "{{ url_for('home') }}">Crack</a>

            <nav aria-label = "Main navigation">
                <a href = "{{ url_for('dashboard') }}">Dashboard</a>
                <a href = "{{ url_for('practice') }}">Practice interview</a>

                {% if session.get("user_id") %}
                    <form method = "post" action = "{{ url_for('logout') }}" class = "logout-form">
                        <input type = "hidden" name = "csrf_token" value = "{{ session.get('csrf_token', '') }}">
                        <button type = "submit">Log out</button>
                    </form>
                {% else %}
                    <a href = "{{ url_for('login') }}">Log in</a>
                {% endif %}

                <label for = "ui-picker">UI</label>
                <select id = "ui-picker">
                    <option value = "default">Default</option>
                    <option value = "ocean">Ocean</option>
                    <option value = "matrix">Matrix</option>
                    <option value = "dark">Dark</option>
                    <option value = "white">White</option>
                </select>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        {% block scripts %}{% endblock %}

        <script>
            const uiPicker = document.getElementById("ui-picker");
            const storageKey = "crack-ui";
            const themeOptions = Array.from(uiPicker.options);

            try {
                const savedTheme = localStorage.getItem(storageKey);

                if (themeOptions.some(option => option.value === savedTheme)) {
                    uiPicker.value = savedTheme;
                }
            } catch {
                uiPicker.value = "default";
            }

            document.documentElement.dataset.ui = uiPicker.value;

            uiPicker.addEventListener("change", () => {
                document.documentElement.dataset.ui = uiPicker.value;

                try {
                    localStorage.setItem(storageKey, uiPicker.value);
                } catch {
                    
                }
            });
        </script>
    </body>
</html>
